<!-- <div class="back-btn" (click)="goBack()">← Back</div> -->
<div class="loan-type-container">
  <!-- Breadcrumb -->
  <!-- <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb> -->

  <!-- Critical LCP element - rendered immediately without waiting for component initialization -->
  <!-- Inline styles ensure immediate rendering without CSS file dependency -->
  <!-- Using system font stack first, then Inter when loaded to prevent render blocking -->
  <h2 style="font-size: 1.8rem; font-weight: 700; margin-bottom: 0.4rem; color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif, 'Inter', sans-serif;">Choose the Type of Loan you need</h2>
  <p class="subtitle">Select a loan type below to continue</p>

  <!-- Loan cards - can be deferred slightly but keeping synchronous for now to maintain UX -->
  <div class="loan-grid">
    <div
      class="loan-card"
      *ngFor="let type of loanTypes; trackBy: trackByLoanType"
      [class.active]="selectedType === type.value"
      (click)="selectType(type.value)"
    >
      <div class="icon">
        <img [src]="type.icon" alt="{{ type.title }}" class="icon-img" loading="lazy" />
      </div>
      <div>
        <h3>{{ type.title }}</h3>
        <p>{{ type.description }}</p>
      </div>
    </div>
  </div>

  <!-- <button class="next-btn" (click)="continue()" [disabled]="!selectedType">
    Continue
  </button> -->
</div>
