<!-- Inline critical CSS for immediate rendering - prevents render blocking -->
<div class="loan-container" style="max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; min-height: 400px;">
  <!-- Show steps and progress bar only if not viewing contact details -->
  <ng-container *ngIf="!showContactDetails">
    <p class="step-info" *ngIf="currentStep !== 5">Step {{ currentStep }} of {{ totalSteps }}</p>
    <div class="progress-bar" *ngIf="currentStep !== 5">
      <div class="progress" [style.width.%]="progressPercentage"></div>
    </div>

    <ng-container [ngSwitch]="currentStep">
      <!-- Step 1 - Critical LCP element, render immediately -->
      <app-step1-loan-type
        *ngSwitchCase="1"
        (next)="nextStep()"
      ></app-step1-loan-type>

      <app-step2-details
        *ngSwitchCase="2"
        (next)="nextStep()"
        (back)="prevStep()"
      ></app-step2-details>

      <app-step3-details
        *ngSwitchCase="3"
        (next)="nextStep()"
        (back)="prevStep()"
      ></app-step3-details>

      <app-step4-details
        *ngSwitchCase="4"
        (next)="nextStep()"
        (back)="prevStep()"
      ></app-step4-details>

      <app-loan-eligible
        *ngSwitchCase="5"
        (back)="prevStep()"
        (contactUs)="openContactDetails()"
      ></app-loan-eligible>
    </ng-container>
  </ng-container>

  <!-- Only Contact Details Section -->
  <ng-container *ngIf="showContactDetails">
    <app-contact-details
      (back)="showContactDetails = false"
    ></app-contact-details>
  </ng-container>
</div>
