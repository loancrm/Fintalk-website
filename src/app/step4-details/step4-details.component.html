<div class="back-btn" (click)="goBack()">← Back</div>

<div *ngIf="loanType === 'businessLoan'">
  <h2>Choose the Business Turnover</h2>
  <p>Select a Business Turnover below to continue</p>

  <div class="loan-grid">
    <div
      class="loan-card"
      *ngFor="let entity of TurnoverTypes"
      [class.active]="selectedTurnover === entity.name"
      (click)="selectEntity(entity.name)"
    >
      <div class="icon mb-3">
        <img [src]="entity.icon" alt="{{ entity.title }}" />
      </div>
      <h3>{{ entity.title }}</h3>
      <!-- <p>{{ entity.description }}</p> -->
    </div>
  </div>
</div>
<div class="loan-form" *ngIf="loanType === 'personalLoan'">
  <h2>Enter Your Company Name</h2>
  <p>Please provide your company name to continue</p>

  <div class="p-field d-flex justify-content-center align-items-center">
    <input
      id="companyName"
      type="text"
      pInputText
      [(ngModel)]="companyName"
      placeholder="Enter company name"
      class="company-input"
    />
  </div>
  <div style="text-align: right">
    <button
      class="next-btn"
      [disabled]="!companyName"
      (click)="submitCompanyName()"
    >
      Next
    </button>
  </div>
</div>
