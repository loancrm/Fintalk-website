<!-- Breadcrumb -->
<app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

<div class="back-btn" (click)="goBack()">← Back</div>

<div *ngIf="loanType === 'Business Loan'">
  <h2>Choose the Business Vintage</h2>
  <p>Select a Business Vintage below to continue</p>

  <div class="loan-grid">
    <div
      class="loan-card"
      *ngFor="let entity of VinatgeTypes"
      [class.active]="selectedVintage === entity.name"
      (click)="selectEntity(entity.name)"
    >
      <div class="icon mb-3">
        <img [src]="entity.icon" alt="{{ entity.title }}" />
      </div>
      <h3>{{ entity.title }}</h3>
      <!-- <p>{{ entity.description }}</p> -->
    </div>
  </div>
</div>

<div *ngIf="loanType === 'Personal Loan'">
  <h2>Choose the Job Experience</h2>
  <p>Select a Business Vintage below to continue</p>

  <div class="loan-grid">
    <div
      class="loan-card"
      *ngFor="let exp of workExpRanges"
      [class.active]="selectedExperience === exp.name"
      (click)="selectExperience(exp.name)"
    >
      <div class="icon mb-3">
        <img [src]="exp.icon" alt="{{ exp.title }}" />
      </div>

      <h3>{{ exp.title }}</h3>
      <!-- <p>{{ exp.description }}</p> -->
    </div>
  </div>
</div>
