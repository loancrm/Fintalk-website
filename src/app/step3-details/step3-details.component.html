<div class="back-btn" (click)="goBack()">← Back</div>

<div *ngIf="loanType === 'businessLoan'">
  <h2>Choose the Business Vintage</h2>
  <p>Select a Business Vintage below to continue</p>

  <div class="loan-grid">
    <div
      class="loan-card"
      *ngFor="let entity of VinatgeTypes"
      [class.active]="selectedVintage === entity.name"
      (click)="selectEntity(entity.name)"
    >
      <div class="icon mb-3">
        <img [src]="entity.icon" alt="{{ entity.title }}" />
      </div>
      <h3>{{ entity.title }}</h3>
      <!-- <p>{{ entity.description }}</p> -->
    </div>
  </div>
</div>

<div *ngIf="loanType === 'personalLoan'">
  <h2>Choose the Job Experience</h2>
  <p>Enter Your Job Experience below to continue</p>

  <div class="p-field d-flex justify-content-center align-items-center">
    <input
      id="selectedExperience"
      type="text"
      pInputText
      [(ngModel)]="selectedExperience"
      placeholder="Enter Work Experience"
      class="company-input"
    />
  </div>
  <div style="text-align: right">
    <button
      class="next-btn"
      [disabled]="!selectedExperience"
      (click)="submitExperience()"
    >
      Next
    </button>
  </div>
